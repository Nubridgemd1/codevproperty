<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoDev — Admin Console</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=18" />
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=18" />
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=18" />
<link rel="shortcut icon" href="favicon-32.png?v=18" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<link rel="stylesheet" href="styles.css?v=24" />
<style>
  body{background:var(--soft)}
  .adminbar{background:var(--navy);color:#fff}.adminbar .logo{border-color:var(--bronze2);color:#fff}.adminbar .brand b{color:#fff}
  .tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content}
  .tab{padding:8px 16px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;border:none;background:none}
  .tab.active{background:var(--navy);color:#fff}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .n{font-family:'Fraunces',serif;font-size:26px;color:var(--navy)}.stat .l{font-size:12px;color:var(--ink2);margin-top:2px}
  .gate{max-width:420px;margin:8vh auto;padding:28px}
  .subrow td{padding:6px 8px}.subrow input,.subrow select{padding:6px 8px;font-size:13px}
  .ph-thumb.is-cover{outline:2px solid var(--bronze);outline-offset:-1px}
  .ph-thumb .cover-badge{position:absolute;top:4px;left:4px;background:var(--bronze);color:#fff;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;z-index:2}
  .ph-thumb .mkcover{position:absolute;top:4px;left:4px;right:auto;width:22px;height:22px;border-radius:50%;border:none;background:rgba(15,34,51,.72);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
  .ph-thumb .mkcover:hover{background:var(--bronze)}
</style>
</head>
<body>

<div id="gate" class="gate card"></div>

<div id="console" class="hide">
  <div class="adminbar"><div class="wrap spread" style="padding:14px 22px">
    <div class="brand" style="gap:0"><span style="font-family:'Fraunces',Georgia,serif;font-size:18px;line-height:1;color:#fff"><b style="display:inline;font-weight:700">CoDev</b> <span style="font-weight:500;color:#c6d2de">Admin Console</span></span></div>
    <div class="row" style="gap:8px"><span class="badge role" id="who"></span><a class="btn ghost sm" style="color:#cfdbe6" href="index.html" target="_blank">View site ↗</a><button class="btn sm" onclick="ADMIN.lock()">Lock</button></div>
  </div></div>
  <div class="wrap" style="padding:24px 22px">
    <div class="grid g4" id="stats" style="margin-bottom:20px"></div>
    <div class="tabs" style="margin-bottom:18px">
      <button class="tab active" data-t="properties" onclick="ADMIN.tab('properties')">Properties &amp; milestones</button>
      <button class="tab" data-t="accounts" onclick="ADMIN.tab('accounts')">Accounts</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal wide"><div class="spread" style="margin-bottom:14px"><h3 id="mTitle" style="margin:0">Edit</h3><button class="btn ghost sm" onclick="ADMIN.closeModal()">✕</button></div><div id="mBody"></div></div></div>

<script src="data.js?v=24"></script>
<script>
(function(){
  const { CFG, auth, db, fmtN, esc } = window.CODEV;
  const $ = (s)=>document.querySelector(s);
  let curTab='properties'; let PROPS=[], ACCS=[], DOCS=[], DRA=[]; let FX=null;
  const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);};

  // ---------- role-based access control ----------
  const PERMS = CFG.PERMISSIONS || []; const ALLP = CFG.ALL_PERMISSIONS || [];
  function myProfile(){ return CFG.configured ? auth.profile() : { role:'admin', email:CFG.ADMIN_EMAIL, permissions:ALLP.slice() }; }
  function myPerms(){ const p=myProfile()||{}; if(String(p.email||'').toLowerCase()===String(CFG.ADMIN_EMAIL||'').toLowerCase()) return ALLP.slice();
    const perms=Array.isArray(p.permissions)?p.permissions:[]; if(p.role==='admin' && perms.length===0) return ALLP.slice(); /* legacy admin = full */ return perms; }
  const can = (k)=> myPerms().indexOf(k)>=0;
  // Console access = full admin OR a legal-review partner. Full admins get every tab; a
  // legal partner (role 'legal' / permission 'legal_review') sees only the Legal review tab.
  const isFullAdmin = ()=> (myProfile()||{}).role==='admin';
  const canLegal = ()=> isFullAdmin() || (myProfile()||{}).role==='legal' || can('legal_review');
  const hasConsoleAccess = (p)=>{ p=p||myProfile()||{}; const perms=Array.isArray(p.permissions)?p.permissions:[]; return p.role==='admin' || p.role==='legal' || perms.indexOf('legal_review')>=0; };
  const permLabel = (k)=>{ const f=PERMS.find(x=>x[0]===k); return f?f[1]:k; };
  const isMe = (a)=>{ const p=myProfile()||{}; return a && (a.id===p.id || (a.email && p.email && a.email.toLowerCase()===p.email.toLowerCase())); };

  // ---------- gate ----------
  function renderGate(){
    $('#gate').innerHTML = `<div class="brand" style="justify-content:center;gap:0;margin-bottom:14px"><span style="font-family:'Fraunces',Georgia,serif;font-size:20px;line-height:1;color:var(--navy)"><b style="display:inline;font-weight:700">CoDev</b> <span style="font-weight:500;color:var(--ink2)">Admin Console</span></span></div>
      <p class="small muted center">${CFG.configured?'Sign in with your admin account.':'Enter the admin passcode.'}</p>
      <form onsubmit="return ADMIN.login(event)" style="margin-top:14px">
        ${CFG.configured?`<div class="field"><label>Admin email</label><input id="aEmail" type="email" required autofocus placeholder="admin@codevproperty.com"></div>
          <div class="field"><label>Password</label><input id="aPass" type="password" required></div>`
          :`<div class="field"><label>Passcode</label><input id="aPass" type="password" required autofocus></div>`}
        <button class="btn primary" style="width:100%" id="loginBtn">Unlock console</button>
        ${CFG.configured?`<p class="tiny muted center" style="margin-top:8px"><a href="#" onclick="ADMIN.forgot();return false">Forgot password?</a></p>`:''}
        <p class="tiny muted center" style="margin-top:6px">${CFG.configured?'Real authentication via Supabase. Only accounts with the admin role may enter.':'Demo passcode: <b>admin2026</b>'}</p>
      </form>`;
  }
  const gateHead = `<div class="brand" style="justify-content:center;gap:0;margin-bottom:14px"><span style="font-family:'Fraunces',Georgia,serif;font-size:20px;line-height:1;color:var(--navy)"><b style="display:inline;font-weight:700">CoDev</b> <span style="font-weight:500;color:var(--ink2)">Admin Console</span></span></div>`;
  function backToLogin(){ renderGate(); }
  function forgot(){ $('#gate').innerHTML = gateHead + `<form onsubmit="return ADMIN.forgotSend(event)" style="margin-top:8px">
      <p class="small muted center" style="margin:0 0 10px">Enter your admin email to get a 6-digit reset code.</p>
      <div class="field"><label>Admin email</label><input id="fEmail" type="email" required autofocus></div>
      <button class="btn primary" style="width:100%" id="fBtn">Send reset code</button>
      <p class="tiny muted center" style="margin-top:10px"><a href="#" onclick="ADMIN.backToLogin();return false">Back to sign in</a></p></form>`; }
  async function forgotSend(e){ e.preventDefault(); const email=$('#fEmail').value.trim(); const btn=$('#fBtn'); btn.disabled=true; btn.textContent='Sending…';
    try{ await auth.sendRecovery(email);
      $('#gate').innerHTML = gateHead + `<form onsubmit="return ADMIN.forgotReset(event,'${esc(email)}')" style="margin-top:8px">
        <p class="small muted center" style="margin:0 0 10px">Enter the code sent to <b>${esc(email)}</b> and choose a new password.</p>
        <div class="field"><label>6-digit code</label><input id="rCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus></div>
        <div class="field"><label>New password</label><div style="position:relative"><input id="rPass" type="password" minlength="6" required style="width:100%;padding-right:42px"><button type="button" tabindex="-1" onclick="var i=this.previousElementSibling;i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;opacity:.7">👁</button></div></div>
        <button class="btn primary" style="width:100%" id="rBtn">Update password &amp; enter</button>
        <p class="tiny muted center" style="margin-top:10px"><a href="#" onclick="ADMIN.backToLogin();return false">Back to sign in</a></p></form>`;
    }catch(err){ toast(err.message||'Could not send code'); btn.disabled=false; btn.textContent='Send reset code'; }
    return false; }
  async function forgotReset(e,email){ e.preventDefault(); const code=$('#rCode').value.trim(); const password=$('#rPass').value; const btn=$('#rBtn'); btn.disabled=true; btn.textContent='Updating…';
    try{ await auth.resetPassword({email, code, password}); await auth.refreshProfile(); const p=auth.profile();
      if(!hasConsoleAccess(p)){ await auth.signOut(); toast('That account has no console access'); renderGate(); return false; }
      toast('Password updated'); await show();
    }catch(err){ toast(err.message||'Invalid or expired code'); btn.disabled=false; btn.textContent='Update password & enter'; }
    return false; }
  async function login(e){e.preventDefault(); const btn=$('#loginBtn'); btn.disabled=true; btn.textContent='Checking…';
    try{
      if(CFG.configured){
        await auth.signIn({email:$('#aEmail').value.trim(), password:$('#aPass').value});
        await auth.refreshProfile(); const p=auth.profile();
        if(!hasConsoleAccess(p)){ await auth.signOut(); toast('That account has no console access'); btn.disabled=false; btn.textContent='Unlock console'; return false; }
      } else {
        if($('#aPass').value!==(CFG.ADMIN_PASSCODE||'admin2026')){ toast('Incorrect passcode'); btn.disabled=false; btn.textContent='Unlock console'; return false; }
        sessionStorage.setItem('codev_admin','1');
      }
      await show();
    }catch(err){ toast(err.message||'Login failed'); btn.disabled=false; btn.textContent='Unlock console'; }
    return false;
  }
  async function lock(){ if(CFG.configured) await auth.signOut(); else sessionStorage.removeItem('codev_admin'); location.reload(); }

  async function show(){
    $('#gate').classList.add('hide'); $('#console').classList.remove('hide');
    if(CFG.configured){ const p=auth.profile(); $('#who').textContent=(p&&p.name?p.name:'Admin')+' · '+((p&&p.role)||'admin'); } else $('#who').textContent='Admin';
    await load();
  }
  async function load(){
    $('#panel').innerHTML='<div class="card pad muted">Loading…</div>';
    try{ PROPS=await db.properties.listAll(); ACCS=CFG.configured?await db.profiles.listAll():await db.profiles.listAll(); }
    catch(err){ toast(err.message||'Load failed'); }
    try{ DOCS=await db.documents.listAll(); }catch(e){ DOCS=[]; } // best-effort; legal tab re-checks & shows a setup hint if the table is missing
    try{ FX=await db.settings.getFx(); }catch(e){ FX=CFG.FX_DEFAULT; } if(!FX) FX=CFG.FX_DEFAULT;
    renderStats(); tab(curTab);
  }
  function renderStats(){ const pendAcc=ACCS.filter(a=>a.role!=='admin'&&['pending','under_review',''].includes(String(a.status||'').toLowerCase())).length; const st=[['Accounts awaiting approval',pendAcc],['Properties pending',PROPS.filter(p=>p.status==='pending').length],['Accounts',ACCS.length],['Verified live',PROPS.filter(p=>p.status==='verified').length]];
    $('#stats').innerHTML=st.map(s=>`<div class="stat"><div class="n">${s[1]}</div><div class="l">${s[0]}</div></div>`).join(''); }
  function renderTabs(){ const tabs=[];
    if(isFullAdmin()){ tabs.push(['properties','Developments']); }
    if(canLegal()){ tabs.push(['legal','Legal review']); }
    if(isFullAdmin()){ tabs.push(['investors','Investors'],['accounts','Accounts']); if(can('manage_admins')) tabs.push(['admins','Admins &amp; roles']); }
    if(!tabs.length) tabs.push(['legal','Legal review']);
    if(!tabs.some(x=>x[0]===curTab)) curTab=tabs[0][0];
    const bar=document.querySelector('.tabs'); if(bar) bar.innerHTML=tabs.map(t=>`<button class="tab ${t[0]===curTab?'active':''}" data-t="${t[0]}" onclick="ADMIN.tab('${t[0]}')">${t[1]}</button>`).join(''); }
  function tab(t){ curTab=t; renderTabs();
    if(t==='investors'){ $('#panel').innerHTML='<div class="card pad muted">Loading investor pipeline…</div>'; loadInvestors(); return; }
    if(t==='legal'){ loadLegal(); return; }
    $('#panel').innerHTML = t==='admins'?adminsPanel():(t==='accounts'?accountsPanel():propertiesPanel()); }

  // ---------- INVESTOR PIPELINE (qualification → CoDev verification) ----------
  let QUALS=[];
  const QSTAT={ qualification_in_progress:['In review','pending'], qualified:['Qualified','pending'], codev_verified:['CoDev Verified','verified'], more_info:['More info needed','pending'], not_qualified:['Not qualified','rejected'], withdrawn:['Withdrawn','rejected'] };
  const qLabel=(s)=>(QSTAT[s]||[s||'—','role'])[0]; const qCls=(s)=>(QSTAT[s]||['','role'])[1];
  const GATE={ pending:'Pending', passed:'Passed', review:'Review', failed:'Failed' };
  async function loadInvestors(){ try{ QUALS=await db.qualifications.listAll(); }
    catch(e){ if(/qualification|relation|does not exist|not found|42P01|schema cache|\(40[0-4]\)/i.test((e&&e.message)||'')){ $('#panel').innerHTML='<div class="card pad"><b>Investor pipeline needs a one-time backend setup.</b><p class="small muted" style="margin:8px 0 0">Run <code>INVESTOR-QUALIFICATION.sql</code> in the Supabase SQL editor, then reload this page.</p></div>'; return; } QUALS=[]; }
    $('#panel').innerHTML=investorsPanel(); }
  function investorsPanel(){
    const n=QUALS.length, verified=QUALS.filter(q=>q.status==='codev_verified').length, inprog=QUALS.filter(q=>q.status==='qualification_in_progress').length, ready=QUALS.filter(q=>/immediately|30 days/i.test(q.readiness||'')).length;
    const mx=[['Total qualifications',n],['In review',inprog],['CoDev Verified',verified],['Ready ≤30 days',ready]];
    const rows=QUALS.map(q=>`<tr>
      <td><b>${esc(q.user_name||'—')}</b><div class="tiny muted">${esc(q.user_email||'')}</div><div class="tiny muted">${esc(q.investor_type||'')}</div></td>
      <td>${esc(q.property_title||'—')}<div class="tiny muted">${esc(q.developer||'')}</div></td>
      <td>${esc(q.amount_band||'—')}<div class="tiny muted">Capacity: ${esc(q.capacity_range||'—')} · ${esc(q.currency||'')}</div></td>
      <td>${esc(q.readiness||'—')}<div class="tiny muted">${esc(q.source_of_funds||'')}${q.mortgage_required?' · mortgage':''}</div></td>
      <td><span class="badge ${qCls(q.status)}">${esc(qLabel(q.status))}</span><div class="tiny muted" style="margin-top:3px">ID ${q.gate_identity?esc(GATE[q.gate_identity]||q.gate_identity):'—'} · KYC ${q.gate_kyc?esc(GATE[q.gate_kyc]||q.gate_kyc):'—'}</div></td>
      <td style="text-align:right"><button class="btn sm navy" onclick="ADMIN.reviewQ('${q.id}')">Review</button></td></tr>`).join('');
    return `<div class="card pad" style="margin-bottom:16px"><div class="grid g4">${mx.map(m=>`<div class="stat"><div class="n">${m[1]}</div><div class="l">${m[0]}</div></div>`).join('')}</div>
      <p class="tiny muted" style="margin:12px 0 0">CoDev delivers <b>qualified capital, not leads</b> — verify identity, KYC/AML, intent, capacity and source of funds before granting Deal Room access.</p></div>
      <div class="card" style="overflow:hidden"><table><thead><tr><th>Investor</th><th>Development</th><th>Amount / capacity</th><th>Readiness / funds</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows||`<tr><td colspan="6" class="muted tiny" style="padding:16px">No qualifications yet. They appear here when an investor completes the qualification form on a development.</td></tr>`}</tbody></table></div>`;
  }
  function reviewQ(id){ const q=QUALS.find(x=>x.id===id); if(!q) return; QEDIT=id;
    const sel=(name,val,opts)=>`<select id="${name}">${opts.map(o=>`<option value="${o[0]}" ${String(val||'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    $('#mTitle').textContent='Review qualification';
    $('#mBody').innerHTML=`<div class="card pad" style="background:var(--soft);margin-bottom:14px"><b>${esc(q.user_name||'')}</b> · ${esc(q.user_email||'')}<br>
      <span class="tiny muted">${esc(q.investor_type||'')} · interested in <b>${esc(q.property_title||'')}</b>${q.unit_type?` (${esc(q.unit_type)})`:''}</span></div>
      <div class="grid g2" style="gap:12px">
        <div><div class="tiny muted">Objective</div>${esc(q.objective||'—')}</div>
        <div><div class="tiny muted">Readiness</div>${esc(q.readiness||'—')}</div>
        <div><div class="tiny muted">Amount</div>${esc(q.amount_band||'—')} ${esc(q.currency||'')}</div>
        <div><div class="tiny muted">Capacity</div>${esc(q.capacity_range||'—')}</div>
        <div><div class="tiny muted">Funding</div>${esc(q.funding_method||'—')}${q.mortgage_required?' · mortgage required':''}</div>
        <div><div class="tiny muted">Source of funds</div>${esc(q.source_of_funds||'—')}</div>
        <div><div class="tiny muted">Declaration</div>${q.declaration?'✓ Accepted':'—'}</div></div>
      <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
      <div class="row" style="gap:12px">
        <div class="field" style="flex:1;min-width:130px"><label>Identity</label>${sel('qId',q.gate_identity||'pending',[['pending','Pending'],['passed','Passed'],['review','Review'],['failed','Failed']])}</div>
        <div class="field" style="flex:1;min-width:130px"><label>KYC / AML</label>${sel('qKyc',q.gate_kyc||'pending',[['pending','Pending'],['passed','Passed'],['review','Review'],['failed','Failed']])}</div></div>
      <div class="field"><label>Overall qualification status</label>${sel('qStatus',q.status,[['qualification_in_progress','In review'],['more_info','More information needed'],['qualified','Qualified'],['codev_verified','CoDev Verified'],['not_qualified','Not qualified'],['withdrawn','Withdrawn']])}</div>
      <p class="tiny muted">Set <b>CoDev Verified</b> only after identity, KYC/AML, intent, capacity and source of funds are satisfied. This gates Deal Room access.</p>
      <button class="btn primary" style="width:100%" onclick="ADMIN.saveQ()">Save decision</button>`;
    $('#modal').classList.add('open'); document.body.style.overflow='hidden';
  }
  let QEDIT=null;
  async function saveQ(){ if(!QEDIT) return; const id=QEDIT;
    const patch={ gate_identity:$('#qId').value, gate_kyc:$('#qKyc').value, status:$('#qStatus').value };
    if(patch.status==='codev_verified'){ patch.verified_at=window.CODEV.now(); patch.verified_by=(myProfile()||{}).email||''; }
    try{ await db.qualifications.update(id,patch); closeModal(); toast('Qualification updated'); await loadInvestors(); }
    catch(err){ toast(err.message||'Save failed'); } }

  // ---------- PROPERTIES ----------
  function fundedPct(p){ return (p.milestones||[]).filter(m=>m.status==='certified').reduce((n,m)=>n+(Number(m.pct)||0),0); }
  // ---------- LEGAL REVIEW (assurance & due diligence) ----------
  const DOC_LBL=(s)=>{ const f=(CFG.DOC_STATUSES||[]).find(x=>x[0]===s); return f?f[1]:'Awaiting submission'; };
  const docBadge=(s)=>{ const c=s==='cleared'?'verified':s==='under_review'?'pending':s==='rejected'?'rejected':'role'; return `<span class="badge ${c}">${esc(DOC_LBL(s))}</span>`; };
  // Interactive per-document uploader shown inside the Edit · milestones modal.
  function admDocRows(pid){ const list=(DOCS||[]).filter(d=>d.propertyId===pid);
    return mergeDocsAdmin(list).map(r=>{ const d=r.doc; const st=d?d.status:'awaiting';
      return `<div class="card pad" style="background:#fff"><div class="spread"><b class="small">${esc(r.label)}</b>${docBadge(st)}</div>
        ${d&&d.fileName?`<div class="tiny muted" style="margin-top:4px">📎 ${esc(d.fileName)}${d.fileData?` · <a href="${d.fileData}" download="${esc(d.fileName)}">download</a>`:''}</div>`:''}
        ${d&&d.note?`<div class="tiny" style="color:#b4232a;margin-top:4px">Reviewer note: ${esc(d.note)}</div>`:''}
        <label class="photo-drop" style="margin-top:8px;min-height:60px"><input type="file" accept="application/pdf,image/*,.pdf,.png,.jpg,.jpeg,.heic,.heif" onchange="ADMIN.uploadDoc('${pid}','${esc(r.key)}',this)"><span class="pd-inner" style="font-size:13px">📤 ${d&&d.fileName?'Replace document':'Upload document'} (PDF or image, max 6MB)</span></label></div>`; }).join(''); }
  async function uploadDoc(pid,key,input){ const f=input.files&&input.files[0]; input.value=''; if(!f) return; if(f.size>6*1024*1024){toast('File too large — max 6MB');return;}
    const label=((CFG.REQUIRED_DOCS||[]).find(t=>t.key===key)||{}).label||key; toast('Uploading…');
    try{ const dataUrl=await fileToDataURLA(f); await db.documents.submit(pid,{key,label,fileData:dataUrl,fileName:f.name,fileType:f.type});
      try{ DOCS=await db.documents.listAll(); }catch(e){} const box=document.getElementById('docUpRows'); if(box) box.innerHTML=admDocRows(pid); toast('Uploaded — status set to Under review'); }
    catch(e){ toast((e&&e.message)||'Upload failed'); } }
  function mergeDocsAdmin(list){ const m={}; (list||[]).forEach(d=>{m[d.key]=d;}); const rows=(CFG.REQUIRED_DOCS||[]).map(t=>({key:t.key,label:t.label,doc:m[t.key]||null})); (list||[]).forEach(d=>{ if(!(CFG.REQUIRED_DOCS||[]).some(t=>t.key===d.key)) rows.push({key:d.key,label:d.label||d.key,doc:d}); }); return rows; }
  function docSummaryChip(list){ const req=(CFG.REQUIRED_DOCS||[]).length; const cl=(list||[]).filter(d=>d.status==='cleared').length; const ur=(list||[]).filter(d=>d.status==='under_review').length; const rj=(list||[]).filter(d=>d.status==='rejected').length; return `<span class="tiny muted">Docs ${cl}/${req} verified${ur?` · ${ur} under review`:''}${rj?` · ${rj} action`:''}</span>`; }
  async function loadLegal(){ $('#panel').innerHTML='<div class="card pad muted">Loading documents…</div>';
    try{ DOCS=await db.documents.listAll(); }
    catch(e){ if(/listing_documents|relation|does not exist|42P01|schema cache|\(40[0-4]\)/i.test((e&&e.message)||'')){ $('#panel').innerHTML='<div class="card pad"><b>Document review needs a one-time backend setup.</b><p class="small muted" style="margin:8px 0 0">Run <code>DOCUMENTS.sql</code> in the Supabase SQL editor, then reload this page.</p></div>'; return; } DOCS=[]; }
    try{ DRA=await db.dealroom.listAccess(); }catch(e){ DRA=[]; } // Deal Room grants (present after DEALROOM.sql)
    $('#panel').innerHTML=legalPanel(); }
  function legalPanel(){

    const cards=(PROPS||[]).map(p=>{ const list=byProp[p.id]||[]; const rows=mergeDocsAdmin(list).map(r=>legalDocRow(p,r)).join('');
      return `<div class="card pad" style="margin-bottom:14px"><div class="spread"><div><b>${esc(p.title)}</b>${p.ref?` <span class="badge role" style="font-family:monospace">${esc(p.ref)}</span>`:''}<div class="tiny muted">${esc(p.developer||'')} · ${esc(p.location||'')} · <span class="badge ${p.status}">${p.status}</span></div></div>${docSummaryChip(list)}</div>
      <div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Document</th><th>File</th><th>Decision</th><th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn ghost sm" onclick="ADMIN.openQueries('${p.id}')">💬 Legal queries</button><button class="btn ghost sm" onclick="ADMIN.openReport('${p.id}')">📝 Counsel report</button><button class="btn ghost sm" onclick="ADMIN.openTx('${p.id}')">💼 Transactions</button></div>
      ${dealAccessBlock(p)}</div>`;
    }).join('');
    return `<div class="card pad" style="margin-bottom:16px"><b>Legal review &amp; due diligence</b><p class="tiny muted" style="margin:6px 0 0">Review each listing's key documents and set a verification decision. Buyers see the status on the listing; files are visible only to legal &amp; admins. Admins can publish a listing even while documents are awaiting or under review.</p></div>${cards||'<div class="card pad muted">No listings yet.</div>'}`;
  }
  function legalDocRow(p,r){ const d=r.doc; const st=d?d.status:'awaiting';
    if(!d) return `<tr><td>${esc(r.label)}</td><td class="tiny muted">—</td><td>${docBadge('awaiting')}</td><td class="tiny muted">Awaiting developer submission</td><td></td></tr>`;
    const file=d.fileData?`<a class="btn ghost sm" href="${d.fileData}" target="_blank" rel="noopener" download="${esc(d.fileName||'document')}">📎 View</a>`:'<span class="tiny muted">—</span>';
    const sel=`<select id="ds_${d.id}">${(CFG.DOC_STATUSES||[]).filter(x=>x[0]!=='awaiting').map(x=>`<option value="${x[0]}" ${x[0]===st?'selected':''}>${x[1]}</option>`).join('')}</select>`;
    const note=`<input id="dn_${d.id}" value="${esc(d.note||'')}" placeholder="Reason / note" style="min-width:150px">`;
    return `<tr><td>${esc(r.label)}${d.fileName?`<div class="tiny muted">${esc(d.fileName)}</div>`:''}</td><td>${file}</td><td>${sel}</td><td>${note}</td><td style="text-align:right"><button class="btn sm navy" onclick="ADMIN.reviewDoc('${d.id}')">Save</button></td></tr>`;
  }
  async function reviewDoc(id){ const s=document.getElementById('ds_'+id), n=document.getElementById('dn_'+id); if(!s) return; const status=s.value, note=(n&&n.value.trim())||'';
    try{ await db.documents.review(id,{status,note}); toast('Document '+(status==='cleared'?'verified':status==='rejected'?'flagged':'updated')); await loadLegal(); }catch(e){ toast(e.message||'Save failed'); } }
  function dealAccessBlock(p){ const list=(DRA||[]).filter(a=>a.propertyId===p.id);
    const rows=list.map(a=>{ const c=a.status==='active'?'verified':a.status==='revoked'?'rejected':'role'; const ack=a.acknowledgedAt?('ack '+esc(new Date(a.acknowledgedAt).toLocaleDateString())):'not acknowledged';
      return `<div class="spread" style="padding:4px 0;border-top:1px solid var(--line)"><div><span class="small">${esc(a.userName||a.userEmail||'—')}</span> <span class="badge ${c}">${esc(a.status)}</span><div class="tiny muted">${ack} · ${esc(a.userEmail||'')}</div></div><div class="row" style="gap:6px">${a.status==='active'?`<button class="btn ghost sm danger" onclick="ADMIN.revokeAccess('${a.id}')">Revoke</button>`:`<button class="btn ghost sm" onclick="ADMIN.reinstateAccess('${a.id}')">Reinstate</button>`}</div></div>`; }).join('');
    return `<div style="margin-top:12px"><div class="spread"><span class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em">Deal Room access (${list.length})</span><button class="btn ghost sm" onclick="ADMIN.dealLog('${p.id}')">View access log</button></div>${rows||'<div class="tiny muted" style="padding:4px 0">No buyers have entered the Deal Room yet.</div>'}</div>`; }
  async function revokeAccess(id){ if(!confirm('Revoke this buyer’s Deal Room access?')) return; try{ await db.dealroom.revoke(id); toast('Access revoked'); await loadLegal(); }catch(e){ toast(e.message||'Failed'); } }
  async function reinstateAccess(id){ try{ await db.dealroom.reinstate(id); toast('Access reinstated'); await loadLegal(); }catch(e){ toast(e.message||'Failed'); } }
  async function dealLog(pid){ $('#mTitle').textContent='Deal Room access log'; $('#mBody').innerHTML='<div class="muted">Loading…</div>'; $('#modal').classList.add('show');
    try{ const ev=await db.dealroom.listEvents(pid); $('#mBody').innerHTML= ev.length? `<div style="max-height:60vh;overflow:auto"><table><thead><tr><th>When</th><th>Who</th><th>Event</th><th>Doc</th></tr></thead><tbody>${ev.map(e=>`<tr><td class="tiny">${esc(new Date(e.createdAt).toLocaleString())}</td><td class="tiny">${esc(e.userEmail||'—')}</td><td><span class="badge role">${esc(e.event)}</span></td><td class="tiny muted">${esc(e.docKey||'')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted">No access events yet.</div>'; }

  const TXT={reservation:'Reservation',sale:'Sale / purchase',subscription:'SPV subscription',jv:'Joint venture'};

  function fileToDataURLA(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('Could not read file')); r.readAsDataURL(file); }); }

  async function openQueries(pid){ const p=PROPS.find(x=>x.id===pid)||{}; $('#mTitle').textContent='Legal queries — '+(p.title||''); $('#mBody').innerHTML='<div class="muted">Loading…</div>'; $('#modal').classList.add('show');
    try{ const qs=await db.legalQueries.list(pid); $('#mBody').innerHTML=`<div style="max-height:50vh;overflow:auto">${qs.length?qs.map(q=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="tiny muted spread"><span><b>${q.authorKind==='counsel'?'CoDev Counsel':'Developer'}</b> · ${esc(new Date(q.createdAt).toLocaleString())}</span><span>${q.status==='resolved'?'<span class="badge verified">resolved</span>':`<button class="btn ghost sm" onclick="ADMIN.resolveQuery('${q.id}','${pid}')">Mark resolved</button>`}</span></div><div class="small" style="margin-top:3px;white-space:pre-wrap">${esc(q.body)}</div></div>`).join(''):'<div class="tiny muted">No queries yet.</div>'}</div>
      <div class="row" style="gap:8px;margin-top:12px;align-items:flex-start"><textarea id="clQuery" rows="2" placeholder="Post a query to the developer…" style="flex:1"></textarea><button class="btn primary sm" onclick="ADMIN.postCounselQuery('${pid}')">Post</button></div>`;
    }catch(e){ $('#mBody').innerHTML='<div class="muted">Could not load queries. Run TRANSACTIONS.sql if you have not.</div>'; } }
  async function postCounselQuery(pid){ const el=document.getElementById('clQuery'); const body=(el&&el.value.trim())||''; if(!body){toast('Enter a query');return;} try{ await db.legalQueries.add(pid,body,'counsel'); toast('Posted'); openQueries(pid); }catch(e){toast(e.message||'Failed');} }
  async function resolveQuery(id,pid){ try{ await db.legalQueries.resolve(id,true); openQueries(pid); }catch(e){toast(e.message||'Failed');} }

  async function openReport(pid){ const p=PROPS.find(x=>x.id===pid)||{}; $('#mTitle').textContent='Counsel report — '+(p.title||''); $('#mBody').innerHTML='<div class="muted">Loading…</div>'; $('#modal').classList.add('show');
    try{ const list=await db.legalReports.list(pid); const next=(list[0]?list[0].version:0)+1; $('#mBody').innerHTML=`

      <div class="field"><label>Summary (assurance statement — visible to the developer &amp; verified buyers)</label><textarea id="rpSummary" rows="2"></textarea></div>
      <div class="field"><label>Conditions / limitations</label><textarea id="rpConditions" rows="2"></textarea></div>

      <div style="margin-top:14px"><div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em">Version history</div>${list.length?list.map(r=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><span class="small"><b>v${r.version}</b> · ${esc(DISPO_LBL[r.disposition]||r.disposition)} · ${esc(new Date(r.issuedAt).toLocaleDateString())}</span>${r.scope?`<div class="tiny muted">${esc(r.scope)}</div>`:''}${r.conditions?`<div class="tiny">Conditions: ${esc(r.conditions)}</div>`:''}</div>`).join(''):'<div class="tiny muted" style="margin-top:4px">No reports issued yet.</div>'}</div>`;
    }catch(e){ $('#mBody').innerHTML='<div class="muted">Could not load. Run TRANSACTIONS.sql if you have not.</div>'; } }
  async function issueReport(pid){ const rep={ scope:$('#rpScope').value.trim(), disposition:$('#rpDispo').value, summary:$('#rpSummary').value.trim(), conditions:$('#rpConditions').value.trim() };
    try{ await db.legalReports.issue(pid,rep); toast('Report issued'); openReport(pid); }catch(e){ toast(e.message||'Failed'); } }

  async function openTx(pid){ const p=PROPS.find(x=>x.id===pid)||{}; $('#mTitle').textContent='Transactions — '+(p.title||''); $('#mBody').innerHTML='<div class="muted">Loading…</div>'; $('#modal').classList.add('show');
    try{ const txs=await db.transactions.listForProperty(pid); let quals=[]; try{ quals=(await db.qualifications.listAll()).filter(q=>q.property_id===pid && q.status==='codev_verified'); }catch{}
      $('#mBody').innerHTML=`<div class="card pad" style="background:var(--soft);margin-bottom:12px"><div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">New transaction</div>
        <div class="row" style="gap:8px;flex-wrap:wrap"><select id="txBuyer" style="flex:2;min-width:180px"><option value="">Verified buyer…</option>${quals.map(q=>`<option value="${esc(q.user_id)}|${esc(q.user_email||'')}|${esc(String(q.user_name||'').replace(/\|/g,' '))}">${esc(q.user_name||q.user_email)}</option>`).join('')}</select>
          <select id="txType" style="flex:1;min-width:140px">${Object.entries(TXT).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>
          <input id="txAmount" type="number" placeholder="Amount (₦)" style="flex:1;min-width:120px"><button class="btn primary sm" onclick="ADMIN.createTx('${pid}')">Create</button></div>
        ${quals.length?'':'<div class="tiny muted" style="margin-top:6px">No CoDev-verified buyers for this listing yet — verify a buyer in the Investors pipeline first.</div>'}</div>
        <div class="grid" style="gap:10px">${txs.length?txs.map(t=>adminTxCard(t,p)).join(''):'<div class="tiny muted">No transactions yet.</div>'}</div>`;
    }catch(e){ $('#mBody').innerHTML='<div class="muted">Could not load transactions. Run TRANSACTIONS.sql if you have not.</div>'; } }
  function adminTxCard(t,p){ const st=t.status; const unitOpts=(p&&p.ref)?window.CODEV.unitIds(p.ref,p.units):[];
    return `<div class="card pad"><div class="spread"><div><b>${esc(t.userName||t.userEmail||'Buyer')}</b> · ${esc(TXT[t.txType]||t.txType)}${t.amount?` · ₦${Number(t.amount).toLocaleString()}`:''}${t.unitRef?` · <span class="badge role" style="font-family:monospace">${esc(t.unitRef)}</span>`:''}</div>${txBadge(st)}</div>
      <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><select id="txs_${t.id}">${Object.keys(TXS).map(s=>`<option value="${s}" ${s===st?'selected':''}>${esc(TXS[s])}</option>`).join('')}</select><button class="btn ghost sm" onclick="ADMIN.setTxStatus('${t.id}','${t.propertyId}')">Update status</button><label class="btn ghost sm" style="cursor:pointer">📎 Attach document<input type="file" accept="application/pdf,image/*" style="display:none" onchange="ADMIN.txAttach('${t.id}','${t.propertyId}',this)"></label></div>
      ${(p&&p.ref)?`<div class="row" style="gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap"><span class="tiny muted">Unit / asset:</span><select id="txunit_${t.id}" onchange="ADMIN.txSetUnit('${t.id}','${t.propertyId}')" style="min-width:170px"><option value="">— Whole development —</option>${unitOpts.map(u=>`<option value="${esc(u)}" ${u===t.unitRef?'selected':''}>${esc(u)}</option>`).join('')}</select></div>`:''}
      ${(t.documents||[]).length?`<div class="tiny muted" style="margin-top:8px">Documents:</div>${(t.documents||[]).map(d=>`<div class="spread" style="padding:3px 0"><span class="small">${esc(d.title||d.docType)}${d.docType==='signed'?' <span class="badge role">buyer-signed</span>':''}</span>${d.fileData?`<a class="btn ghost sm" href="${d.fileData}" download="${esc(d.fileName||'document')}">Download</a>`:''}</div>`).join('')}`:''}
      ${t.fundingEvidence?`<div class="small" style="margin-top:6px">💳 Funding evidence: <a href="${t.fundingEvidence}" download="funding-evidence">download</a>${t.fundingNote?' · '+esc(t.fundingNote):''}</div>`:''}
      <div class="card pad" style="background:var(--soft);margin-top:10px">
        <div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Payment calls <span style="text-transform:none;font-weight:400">· tracked for this buyer${t.unitRef?' · '+esc(t.unitRef):''}</span></div>
        ${(t.payments||[]).length?`<div style="overflow-x:auto"><table style="font-size:13px;width:100%"><tbody>${(t.payments||[]).map((pay,idx)=>`<tr>
          <td>${esc(pay.label||'')}</td><td class="tiny muted" style="white-space:nowrap">${esc(pay.dueDate||'')}</td>
          <td style="text-align:right;white-space:nowrap">${(pay.amount!=null&&pay.amount!=='')?'₦'+Number(pay.amount).toLocaleString():'—'}</td>
          <td style="width:110px"><select onchange="ADMIN.txPaySet('${t.id}','${t.propertyId}',${idx},'status',this.value)">${['due','paid','overdue','waived'].map(s=>`<option ${s===(pay.status||'due')?'selected':''}>${s}</option>`).join('')}</select></td>
          <td><button class="btn ghost sm" onclick="ADMIN.txDelPay('${t.id}','${t.propertyId}',${idx})">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="tiny muted">No payment calls yet.</div>'}
        <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><input id="txpl_${t.id}" placeholder="Label (e.g. Deposit, Milestone 1)" style="flex:2;min-width:150px"><input id="txpa_${t.id}" type="number" placeholder="Amount (₦)" style="flex:1;min-width:110px"><input id="txpd_${t.id}" type="date" style="flex:1;min-width:130px"><button class="btn primary sm" onclick="ADMIN.txAddPay('${t.id}','${t.propertyId}')">+ Add call</button></div>
        ${(function(){ const pays=t.payments||[]; const tot=pays.reduce((n,x)=>n+(Number(x.amount)||0),0); const paid=pays.filter(x=>x.status==='paid').reduce((n,x)=>n+(Number(x.amount)||0),0); return tot>0?`<div class="tiny muted" style="margin-top:6px;text-align:right">Paid ₦${paid.toLocaleString()} of ₦${tot.toLocaleString()}</div>`:''; })()}
      </div>

      <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><input id="txcr_${t.id}" placeholder="Completion ref" style="flex:1;min-width:120px"><input id="txcn_${t.id}" placeholder="Completion note" style="flex:2;min-width:150px"><button class="btn sm navy" onclick="ADMIN.completeTx('${t.id}','${t.propertyId}')">Mark completed &amp; archive</button></div>`}
    </div>`; }
  async function createTx(pid){ const b=$('#txBuyer').value; if(!b){toast('Pick a verified buyer');return;} const parts=b.split('|'); const txType=$('#txType').value; const amount=$('#txAmount').value;
    try{ await db.transactions.create({propertyId:pid,userId:parts[0],userEmail:parts[1]||'',userName:parts[2]||'',txType,amount}); toast('Transaction created'); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  async function setTxStatus(id,pid){ const st=document.getElementById('txs_'+id).value; try{ await db.transactions.update(id,{status:st}); toast('Updated'); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  async function txAttach(id,pid,input){ const f=input.files&&input.files[0]; input.value=''; if(!f)return; if(f.size>6*1024*1024){toast('File too large — max 6MB');return;}
    try{ const dataUrl=await fileToDataURLA(f); const cur=(await db.transactions.listForProperty(pid)).find(x=>x.id===id)||{documents:[]}; const documents=(cur.documents||[]).concat([{docType:'issued',title:f.name,fileData:dataUrl,fileName:f.name,status:'issued',issuedAt:new Date().toISOString()}]); await db.transactions.update(id,{documents,status:cur.status==='initiated'?'documents_issued':cur.status}); toast('Attached'); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  async function completeTx(id,pid){ const ref=$('#txcr_'+id).value.trim(); const note=$('#txcn_'+id).value.trim(); try{ await db.transactions.update(id,{status:'completed',completionRef:ref,completionNote:note,completedAt:window.CODEV.now()}); toast('Transaction completed & archived'); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  // ---- Per-deal unit/asset + payment calls (buyer + unit linked; never on the listing) ----
  async function txSetUnit(id,pid){ const ref=(document.getElementById('txunit_'+id)||{}).value||''; try{ await db.transactions.update(id,{unitRef:ref}); toast(ref?('Linked to '+ref):'Set to whole development'); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  async function txAddPay(id,pid){ const label=($('#txpl_'+id).value||'').trim(); const amount=$('#txpa_'+id).value; const due=$('#txpd_'+id).value; if(!label){toast('Enter a label');return;}
    const t=(await db.transactions.listForProperty(pid)).find(x=>x.id===id)||{payments:[]};
    const payments=(t.payments||[]).concat([{label,amount:(amount===''||amount==null)?null:Number(amount),dueDate:due||'',status:'due'}]);
    try{ await db.transactions.update(id,{payments}); toast('Payment call added'); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  async function txPaySet(id,pid,idx,k,v){ const t=(await db.transactions.listForProperty(pid)).find(x=>x.id===id); if(!t)return; const payments=(t.payments||[]).slice(); if(!payments[idx])return;
    payments[idx]=Object.assign({},payments[idx],{[k]:(k==='amount'?((v===''||v==null)?null:Number(v)):v)});
    try{ await db.transactions.update(id,{payments}); openTx(pid); }catch(e){toast(e.message||'Failed');} }
  async function txDelPay(id,pid,idx){ const t=(await db.transactions.listForProperty(pid)).find(x=>x.id===id); if(!t)return; const payments=(t.payments||[]).slice(); payments.splice(idx,1);
    try{ await db.transactions.update(id,{payments}); toast('Payment call removed'); openTx(pid); }catch(e){toast(e.message||'Failed');} }

  function adminPropLocations(){ const s=new Set(); PROPS.forEach(p=>{ const l=(p.location||'').trim(); if(l) s.add(l); }); return Array.from(s).sort((a,b)=>a.localeCompare(b)); }

        ${p.status!=='rejected'?`<button class="btn sm danger" onclick="ADMIN.setStatus('${p.id}','rejected')">Reject</button>`:''}
        <button class="btn sm" onclick="ADMIN.setSold('${p.id}',${p.sold?'false':'true'})">${p.sold?'↩ Mark available':'🏷 Mark sold'}</button>

  function filterProps(){
    const loc=(document.getElementById('pLoc')||{}).value||'';

  function compressImg(file,maxDim,quality){ maxDim=maxDim||1500; quality=quality||0.72; return new Promise((resolve)=>{
    const isImg=(file&&file.type&&file.type.indexOf('image/')===0)||/\.(jpe?g|png|webp|heic|heif)$/i.test((file&&file.name)||''); if(!isImg){resolve(null);return;}
    const reader=new FileReader(); reader.onload=()=>{ const img=new Image();
      img.onload=()=>{ try{ const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height; const scale=Math.min(1,maxDim/Math.max(w0,h0));
        const w=Math.max(1,Math.round(w0*scale)),h=Math.max(1,Math.round(h0*scale)); const c=document.createElement('canvas'); c.width=w;c.height=h;
        const ctx=c.getContext('2d'); ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',quality)); }catch(e){resolve(null);} };
      img.onerror=()=>resolve(null); img.src=reader.result; };
    reader.onerror=()=>resolve(null); reader.readAsDataURL(file); }); }

  async function createProp(e){ e.preventDefault(); const f=e.target;
    const assignTo=resolveAssign(f.assignTo.value); const status=f.status.value;
    let developer=f.developer.value.trim(); if(!developer && assignTo) developer=assignTo.name||assignTo.email;
    const payload={ title:f.title.value.trim(), developer, location:f.location.value.trim(), address:f.address.value.trim(),
      items:(EDIT.items||[]).filter(it=>it.type), units:f.units.value, deliveryDate:f.deliveryDate.value,
      summary:f.summary.value.trim(), priceFrom:Number(f.priceFrom.value), stage:f.stage.value, images:EDIT.images };
    if((EDIT.milestones||[]).length) payload.milestones=EDIT.milestones;
    if(assignTo) payload.assignTo=assignTo;
    try{ const res=await db.properties.add(payload);
      const newId=(Array.isArray(res)&&res[0]&&res[0].id)||null;
      if(newId && (status==='verified'||status==='rejected')) await db.properties.setStatus(newId,status);
      closeModal(); toast(assignTo?('Listing created & assigned to '+(assignTo.name||assignTo.email)+' — they have been notified'):'Listing created'); await load();
    }catch(err){ toast(err.message||'Create failed'); } return false; }

  // ---------- ACCOUNTS ----------
  function accountsPanel(){
    const canV=can('verify_accounts'), canA=can('manage_accounts');
    const badgeCls=(s)=>{ s=String(s||'').toLowerCase(); return (s==='approved'||s==='active')?'verified':((s==='rejected'||s==='suspended')?'role':'pending'); };
    const acctActions=(a)=>{ if(a.role==='admin'||!canV) return ''; const s=String(a.status||'pending').toLowerCase();
      if(s==='pending'||s==='under_review'||s==='') return `<button class="btn primary sm" onclick="ADMIN.setAcctStatus('${a.id}','approved')">Approve</button> <button class="btn sm danger" onclick="ADMIN.setAcctStatus('${a.id}','rejected')">Reject</button>`;
      if(s==='approved'||s==='active') return `<button class="btn sm" onclick="ADMIN.setAcctStatus('${a.id}','suspended')">Suspend</button>`;
      return `<button class="btn primary sm" onclick="ADMIN.setAcctStatus('${a.id}','approved')">Approve</button>`; };
    const roleCell=(a)=>{ if(a.role==='admin') return '<span class="badge role" style="background:#e9dfc7;color:#8a6113">admin</span>';
      return canA?`<select onchange="ADMIN.setRole('${a.id}',this.value)" style="padding:5px 8px;width:auto">${['investor','developer','visitor'].map(r=>`<option ${r===a.role?'selected':''}>${r}</option>`).join('')}</select>`:`<span class="badge role">${esc(a.role||'—')}</span>`; };
    const rows=ACCS.map(a=>`<tr>
      <td><b>${esc(a.name||'—')}</b><div class="tiny muted">${esc(a.email||'')}</div></td>
      <td>${roleCell(a)}</td>
      <td><span class="badge ${badgeCls(a.status)}">${esc(a.status||'pending')}</span></td>
      <td class="tiny muted">${a.createdAt?new Date(a.createdAt).toLocaleDateString():''}</td>
      <td style="white-space:nowrap;text-align:right">${a.role==='developer'?`<button class="btn ghost sm" onclick="ADMIN.viewDev('${a.id}')">Profile</button> `:''}${acctActions(a)}
        ${(canA && a.role!=='admin')?`<button class="btn ghost sm" onclick="ADMIN.delAcc('${a.id}')">🗑</button>`:''}</td></tr>`).join('');
    return `<div class="spread" style="margin-bottom:12px"><h3 style="margin:0;font-size:18px">Accounts</h3>${canA?'<button class="btn primary sm" onclick="ADMIN.addAcc()">+ Add account</button>':''}</div>
      <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="5" class="center muted" style="padding:20px">No accounts yet.</td></tr>`}</tbody></table></div></div>
      <p class="tiny muted" style="margin-top:10px">${!canV&&!canA?'You have view-only access to accounts.':'Admin accounts are managed under <b>Admins &amp; roles</b>.'}</p>`;
  }

  // ---------- ADMINS & ROLES (requires manage_admins) ----------
  function permChips(perms){ perms=Array.isArray(perms)?perms:[]; if(!perms.length) return '<span class="tiny muted">view only</span>';
    return perms.filter(k=>k!=='view').map(k=>`<span class="badge role" style="margin:2px 3px 0 0">${esc(permLabel(k))}</span>`).join(''); }
  function adminsPanel(){
    if(!can('manage_admins')) return '<div class="card pad muted">You do not have permission to manage admins.</div>';
    const fx=FX||CFG.FX_DEFAULT; const cs=CFG.CURRENCY_SYMBOLS||{};
    const fxCard=`<div class="card pad" style="margin-bottom:18px">
      <div class="spread" style="margin-bottom:4px"><h3 style="margin:0;font-size:18px">Currency &amp; FX rates</h3><span class="badge role">Super admin</span></div>
      <p class="small muted" style="margin:0 0 12px">Investor amount bands are anchored in USD and converted for display using these rates (1 USD → currency). Investors pick their currency on the qualification form.</p>
      <form onsubmit="return ADMIN.saveFx(event)"><div class="row" style="gap:12px;align-items:flex-end">
        <div class="field" style="flex:1;min-width:120px"><label>USD (base)</label><input value="1" disabled></div>
        <div class="field" style="flex:1;min-width:120px"><label>NGN per $1 (${esc(cs.NGN||'₦')})</label><input name="NGN" type="number" step="0.0001" min="0" value="${esc(String(fx.NGN||1600))}" required></div>
        <div class="field" style="flex:1;min-width:120px"><label>GBP per $1 (${esc(cs.GBP||'£')})</label><input name="GBP" type="number" step="0.0001" min="0" value="${esc(String(fx.GBP||0.79))}" required></div>
        <div class="field" style="flex:0 0 auto"><button class="btn primary" id="fxBtn">Save rates</button></div>
      </div><p class="tiny muted" style="margin:2px 0 0">Example: at ₦${esc(Number(fx.NGN||1600).toLocaleString())}/$, the “Under $25,000” band shows as “Under ₦${esc(Math.round(25000*(fx.NGN||1600)).toLocaleString())}”.</p></form></div>`;
    const admins=ACCS.filter(a=>a.role==='admin'||a.role==='legal');
    const rows=admins.map(a=>{ const eff=(Array.isArray(a.permissions)&&a.permissions.length)?a.permissions:(a.role==='legal'?['legal_review']:ALLP); const primary=String(a.email||'').toLowerCase()===String(CFG.ADMIN_EMAIL||'').toLowerCase();
      return `<tr>
        <td><b>${esc(a.name||'—')}</b>${a.role==='legal'?' <span class="badge role">legal partner</span>':''}${primary?' <span class="badge role" style="background:#e9dfc7;color:#8a6113">primary</span>':''}${isMe(a)?' <span class="tiny muted">(you)</span>':''}<div class="tiny muted">${esc(a.email||'')}</div></td>
        <td>${permChips(eff)}</td>
        <td style="white-space:nowrap;text-align:right">
          <button class="btn sm navy" onclick="ADMIN.editRights('${a.id}')">Edit rights</button>
          ${(primary||isMe(a))?'':`<button class="btn ghost sm danger" onclick="ADMIN.revokeAdmin('${a.id}')">Revoke</button>`}</td></tr>`; }).join('');
    return fxCard + `<div class="spread" style="margin-bottom:12px"><h3 style="margin:0;font-size:18px">Admins &amp; roles</h3><button class="btn primary sm" onclick="ADMIN.addAdmin()">+ Add admin</button></div>
      <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Admin</th><th>Rights</th><th style="text-align:right">Manage</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="3" class="center muted" style="padding:20px">No admins yet.</td></tr>`}</tbody></table></div></div>
      <p class="tiny muted" style="margin-top:10px">Grant each admin only the rights they need. The primary admin and your own account keep full access and can’t be revoked here.</p>`;
  }
  async function saveFx(e){ e.preventDefault(); const f=e.target; const btn=$('#fxBtn'); if(btn){btn.disabled=true;btn.textContent='Saving…';}
    const rates={ USD:1, NGN:Number(f.NGN.value)||1600, GBP:Number(f.GBP.value)||0.79 };
    try{ await db.settings.setFx(rates); FX=rates; toast('FX rates saved — investor bands now convert at these rates.'); tab('admins'); }
    catch(err){ const m=(err&&err.message)||''; if(/platform_settings|relation|does not exist|42P01|schema cache|\(40[0-4]\)/i.test(m)) toast('FX settings need a one-time setup — run PLATFORM-SETTINGS.sql in Supabase.'); else toast(m||'Save failed'); if(btn){btn.disabled=false;btn.textContent='Save rates';} }
    return false; }
  function permCheckboxes(sel){ sel=sel||[]; return `<div id="permBox" style="display:grid;gap:8px;margin-top:6px">${PERMS.map(p=>`
      <label class="row" style="gap:9px;align-items:flex-start;cursor:pointer"><input type="checkbox" value="${p[0]}" ${sel.indexOf(p[0])>=0?'checked':''} style="margin-top:3px">
        <span><b style="font-size:14px">${esc(p[1])}</b><div class="tiny muted">${esc(p[2]||'')}</div></span></label>`).join('')}</div>
    <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">${Object.keys(CFG.ADMIN_PRESETS).map(name=>`<button type="button" class="btn ghost sm" onclick="ADMIN.applyPreset('${esc(name)}')">${esc(name)}</button>`).join('')}</div>`; }
  function readPerms(){ return Array.from(document.querySelectorAll('#permBox input:checked')).map(i=>i.value); }
  function applyPreset(name){ const set=(CFG.ADMIN_PRESETS[name]||[]); document.querySelectorAll('#permBox input').forEach(i=>{ i.checked=set.indexOf(i.value)>=0; }); }
  function addAdmin(){ $('#mTitle').textContent='Add admin';
    $('#mBody').innerHTML=`<div class="tabs" style="margin-bottom:14px"><button class="tab active" id="tabProm" type="button" onclick="ADMIN.admTab('prom')">Promote existing member</button><button class="tab" id="tabNew" type="button" onclick="ADMIN.admTab('new')">Create new admin</button></div>
      <form onsubmit="return ADMIN.saveAdmin(event)">
        <div id="admProm"><div class="field"><label>Member email</label><input name="pemail" type="email" placeholder="person@example.com"><div class="tiny muted">Must be an existing account. They’ll be granted admin with the rights below.</div></div></div>
        <div id="admNew" class="hide"><div class="field"><label>Full name</label><input name="nname"></div>
          <div class="field"><label>Email</label><input name="nemail" type="email"></div>
          <div class="field"><label>Temp password</label><input name="npass" value="Codev1234!" minlength="6"></div></div>
        <div class="field" style="margin-top:6px"><label>Access level</label><select name="accessLevel" onchange="ADMIN.admAccess(this.value)"><option value="admin">Admin</option><option value="legal">Legal partner — document review &amp; due diligence only</option></select></div>
        <div id="rightsWrap"><label style="margin-top:6px;display:block">Rights</label>${permCheckboxes(['verify_accounts'])}</div>
        <p id="legalNote" class="tiny muted hide" style="margin-top:6px">A legal partner signs in to this console and sees only the <b>Legal review</b> dashboard — every listing's documents, for verification &amp; due diligence.</p>
        <button class="btn primary" style="width:100%;margin-top:14px">Add</button></form>`;
    admMode='prom'; $('#modal').classList.add('show'); }
  let admMode='prom';
  function admTab(m){ admMode=m; document.getElementById('tabProm').classList.toggle('active',m==='prom'); document.getElementById('tabNew').classList.toggle('active',m==='new'); document.getElementById('admProm').classList.toggle('hide',m!=='prom'); document.getElementById('admNew').classList.toggle('hide',m!=='new'); }
  function admAccess(v){ const legal=v==='legal'; const rw=document.getElementById('rightsWrap'); const ln=document.getElementById('legalNote'); if(rw) rw.classList.toggle('hide',legal); if(ln) ln.classList.toggle('hide',!legal); }
  async function saveAdmin(e){ e.preventDefault(); const f=e.target;
    const level=(f.accessLevel&&f.accessLevel.value)||'admin'; const role=level==='legal'?'legal':'admin';
    let perms=level==='legal'?['legal_review']:readPerms(); if(!perms.length) perms=['view'];
    try{
      if(admMode==='prom'){ const email=(f.pemail.value||'').trim().toLowerCase(); if(!email){toast('Enter the member email');return false;}
        const a=ACCS.find(x=>String(x.email||'').toLowerCase()===email); if(!a){ toast('No account with that email — create a new account instead'); return false; }
        await db.profiles.update(a.id,{ role, status:'approved', permissions:perms });
        closeModal(); toast(level==='legal'?'Legal partner added':'Admin added'); await load();
      } else {
        const name=(f.nname.value||'').trim(), email=(f.nemail.value||'').trim(), pass=f.npass.value;
        if(!name||!email||!pass){toast('Complete name, email and password');return false;}
        const d=await db.profiles.add({name,email,role,password:pass}); const newId=d&&d.user&&d.user.id;
        if(newId && CFG.configured){ try{ await db.profiles.update(newId,{ role, name, status:'approved', permissions:perms }); }catch{} }
        closeModal(); toast(level==='legal'?'Legal partner created':'Admin created'); await load();
      }
    }catch(err){ toast(err.message||'Could not add account'); } return false; }
  function editRights(id){ const a=ACCS.find(x=>x.id===id); if(!a) return; const cur=(Array.isArray(a.permissions)&&a.permissions.length)?a.permissions:ALLP.slice();
    $('#mTitle').textContent='Edit rights: '+(a.name||a.email);
    $('#mBody').innerHTML=`<form onsubmit="return ADMIN.saveRights(event,'${id}')"><p class="small muted" style="margin:0 0 8px">Choose what this admin can do.</p>${permCheckboxes(cur)}
      <button class="btn primary" style="width:100%;margin-top:14px">Save rights</button></form>`;
    $('#modal').classList.add('show'); }
  async function saveRights(e,id){ e.preventDefault(); let perms=readPerms(); if(!perms.length) perms=['view'];
    try{ await db.profiles.update(id,{permissions:perms}); closeModal(); toast('Rights updated'); await load(); }catch(err){ toast(err.message||'Save failed'); } return false; }
  async function revokeAdmin(id){ const a=ACCS.find(x=>x.id===id); if(!a) return; if(isMe(a)){toast('You cannot revoke your own admin access');return;}
    if(String(a.email||'').toLowerCase()===String(CFG.ADMIN_EMAIL||'').toLowerCase()){toast('The primary admin cannot be revoked');return;}
    if(confirm('Revoke admin access for "'+(a.name||a.email)+'"? They become a regular member.')){ try{ await db.profiles.update(id,{role:'investor',permissions:[]}); toast('Admin access revoked'); await load(); }catch(err){toast(err.message);} } }
  function addAcc(){ $('#mTitle').textContent='Add account';
    $('#mBody').innerHTML=`<form onsubmit="return ADMIN.saveAcc(event)">
      <div class="field"><label>Full name / company</label><input name="name" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="row" style="gap:12px"><div class="field" style="flex:1"><label>Role</label><select name="role">${['investor','developer','visitor'].map(r=>`<option>${r}</option>`).join('')}</select></div>
        <div class="field" style="flex:1"><label>Temp password</label><input name="pass" value="Codev1234" required minlength="6"></div></div>
      <p class="tiny muted">To create an <b>admin</b>, use the “Admins &amp; roles” tab so you can set their specific rights.</p>
      <button class="btn primary" style="width:100%">Create account</button></form>`;
    $('#modal').classList.add('show'); }
  async function saveAcc(e){ e.preventDefault(); const f=e.target;
    try{ const role=f.role.value; const d=await db.profiles.add({name:f.name.value.trim(),email:f.email.value.trim(),role,password:f.pass.value});
      const newId=d && d.user && d.user.id; if(newId && CFG.configured){ try{ await db.profiles.update(newId,{role,name:f.name.value.trim(),status:'approved'}); }catch{} }
      closeModal(); toast('Account created'); await load();
    }catch(err){ toast(err.message||'Could not create'); } return false; }
  async function setRole(id,role){ try{ await db.profiles.update(id,{role}); toast('Role updated'); await load(); }catch(err){toast(err.message);} }
  async function toggleStatus(id,cur){ try{ await db.profiles.update(id,{status:cur==='active'?'suspended':'active'}); toast('Account '+(cur==='active'?'suspended':'activated')); await load(); }catch(err){toast(err.message);} }
  async function setAcctStatus(id,s){ try{ await db.profiles.update(id,{status:s}); toast(s==='approved'?'Account approved — access granted':('Account '+s)); await load(); }catch(err){toast(err.message);} }
  async function delAcc(id){ const a=ACCS.find(x=>x.id===id); if(confirm('Delete account "'+(a.name||a.email)+'"?')){ try{ await db.profiles.remove(id); toast('Account deleted'); await load(); }catch(err){toast(err.message);} } }

  // ---------- Developer "About" profile (verification view) ----------
  function dvBlob(d){ const [meta,b64]=String(d).split(','); const mime=(meta.match(/data:([^;]+)/)||[])[1]||'application/octet-stream'; const bin=atob(b64||''); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
  function dvOpen(d){ if(!d){toast('Not provided');return;} try{ const url=URL.createObjectURL(dvBlob(d)); window.open(url,'_blank','noopener'); setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){toast('Could not open file');} }
  function openDevFile(id,slot){ const a=ACCS.find(x=>x.id===id); dvOpen(a&&a[slot]); }
  function openDevExtra(id,i){ const a=ACCS.find(x=>x.id===id); const x=a&&Array.isArray(a.devExtras)?a.devExtras[i]:null; dvOpen(x&&x.file); }
  function viewDev(id){ const a=ACCS.find(x=>x.id===id)||{}; $('#mTitle').textContent='Developer profile — '+(a.name||a.email||'');
    const row=(l,v)=>`<div class="spread" style="padding:7px 0;border-bottom:1px solid var(--line2);gap:12px"><span class="tiny muted">${l}</span><span class="tiny" style="font-weight:600;text-align:right">${v?esc(v):'—'}</span></div>`;
    const docRow=(l,slot)=>{ const has=a&&a[slot]; return `<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line2);gap:12px"><span class="tiny" style="font-weight:600">${l}</span>${has?`<button class="btn ghost sm" onclick="ADMIN.openDevFile('${id}','${slot}')">View ↗</button>`:'<span class="tiny muted">— not provided</span>'}</div>`; };
    const extras=Array.isArray(a.devExtras)?a.devExtras:[];
    $('#mBody').innerHTML=`
      ${row('Company / name',a.name)}${row('Email',a.email)}${row('Phone',a.phone)}${row('Website',a.website)}
      ${row('CAC / RC number',a.regNumber)}${row('Year established',a.yearEstablished)}${row('Head office',a.hqAddress)}
      <div style="margin:12px 0 4px;font-weight:700;color:#0f2233">About</div>
      <p class="tiny" style="white-space:pre-wrap;margin:0 0 6px">${a.about?esc(a.about):'<span class="muted">—</span>'}</p>
      <div style="margin:12px 0 4px;font-weight:700;color:#0f2233">Credentials &amp; documents</div>
      ${docRow('Company profile document','companyProfileDoc')}${docRow('CAC / incorporation documents','cacDoc')}${docRow('References','referencesDoc')}${docRow('Brochure','brochure')}
      <div style="margin:14px 0 4px;font-weight:700;color:#0f2233">Additional information</div>
      ${extras.length?extras.map((x,i)=>`<div class="card pad" style="background:#fafafa;margin-bottom:8px"><div class="tiny" style="font-weight:700">${esc(x.label||('Item '+(i+1)))}</div>${x.note?`<div class="tiny" style="white-space:pre-wrap;margin-top:3px">${esc(x.note)}</div>`:''}${x.file?`<button class="btn ghost sm" style="margin-top:6px" onclick="ADMIN.openDevExtra('${id}',${i})">View attachment ↗</button>`:''}</div>`).join(''):'<span class="tiny muted">None added.</span>'}`;
    $('#modal').classList.add('show'); }

  function closeModal(){ $('#modal').classList.remove('show'); }
  window.ADMIN={login,lock,tab,setStatus,setSold,copyRef,onTypeChange,addItem,delItem,itemSet,itemSize,reviewDoc,uploadDoc,revokeAccess,reinstateAccess,dealLog,openQueries,postCounselQuery,resolveQuery,openReport,issueReport,openTx,createTx,setTxStatus,txAttach,completeTx,txSetUnit,txAddPay,txPaySet,txDelPay,admAccess,delProp,editProp,saveProp,newProp,createProp,itemCoords,reviewQ,saveQ,saveFx,addMs,delMs,msSet,addPay,delPay,paySet,addPhotos,delImg,makeCover,addAcc,saveAcc,setRole,toggleStatus,setAcctStatus,delAcc,viewDev,openDevFile,openDevExtra,closeModal,forgot,backToLogin,forgotSend,forgotReset,
    addAdmin,admTab,saveAdmin,editRights,saveRights,revokeAdmin,applyPreset,filterProps};

  // Session timeout in the admin console → message, then back to the sign-in gate.
  window.addEventListener('codev:session-expired', () => { try{ toast('Your session timed out — please sign in again.'); }catch(e){} setTimeout(()=>location.reload(), 1300); });

  renderGate();
  // auto-resume
  if(CFG.configured){ const p=auth.profile(); if(hasConsoleAccess(p)) show(); }
  else if(sessionStorage.getItem('codev_admin')==='1') show();
})();
</script>
</body>
</html>
